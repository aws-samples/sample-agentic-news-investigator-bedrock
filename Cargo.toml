[workspace]
resolver = "2"
members = ["crates/*", "lambdas/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT-0"

[workspace.dependencies]
fin-core = { path = "crates/fin-core" }
fin-md = { path = "crates/fin-md" }
fin-store = { path = "crates/fin-store" }
fin-llm = { path = "crates/fin-llm" }
fin-ingest = { path = "crates/fin-ingest" }

lambda_runtime = "=1.3.0"
aws_lambda_events = { version = "=0.17.0", default-features = false, features = ["eventbridge"] }
# AWS SDK crates: default features select the legacy hyper 0.14 + rustls 0.21 TLS
# client (rustls-webpki 0.101, GHSA-82j2-j2ch-gfr8 and friends). `default-https-client`
# is the hyper 1 + rustls 0.23 client the SDK now ships; nothing here needs the legacy one.
aws-config = { version = "=1.10.1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "=1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eventbridge = { version = "=1.112.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "=1.139.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.140.0", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x"] }
aws-sdk-ssm = { version = "=1.118.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatch = { version = "=1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "=1.107.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "=1.6.1"

tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "gzip", "json"] }
feed-rs = "=2.4.0"
rust_decimal = { version = "=1.43.0", features = ["serde-with-str"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
ulid = "=1.2.1"
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "clock"] }
thiserror = "=2.0.19"
tracing = "=0.1.44"
async-trait = "=0.1.91"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
